<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panda Notes Widget Demo</title>
    <style>
      :root {
        color: #18221d;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          linear-gradient(90deg, rgba(35, 89, 64, 0.09) 1px, transparent 1px),
          linear-gradient(180deg, rgba(35, 89, 64, 0.07) 1px, transparent 1px),
          linear-gradient(135deg, #edf6e7 0%, #dfeccc 44%, #f8ecd1 100%);
        background-size: 42px 42px, 42px 42px, auto;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(920px, 100%);
        display: grid;
        gap: 18px;
        border: 1px solid rgba(43, 68, 54, 0.18);
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(255, 252, 241, 0.92), rgba(248, 237, 215, 0.86));
        box-shadow: 0 18px 54px rgba(39, 61, 48, 0.16);
        padding: clamp(18px, 4vw, 36px);
      }

      h1 {
        margin: 0;
        font-size: clamp(42px, 7vw, 82px);
        line-height: 0.9;
      }

      p {
        max-width: 680px;
        margin: 0;
        color: #32443a;
        line-height: 1.5;
      }

      .demo-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      button,
      a {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(43, 68, 54, 0.16);
        border-radius: 8px;
        background: rgba(251, 246, 232, 0.86);
        color: #18221d;
        font-weight: 850;
        padding: 0 14px;
        text-decoration: none;
      }

      .primary {
        border-color: rgba(31, 101, 64, 0.32);
        background: linear-gradient(135deg, #4fb36a, #b8e26b);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Widget Demo</h1>
      <p>
        Right-click one of these controls to open Panda Notes as an embedded tester popup.
        Save a note, export JSON, then import that file into the standalone console.
      </p>
      <div class="demo-actions">
        <button
          class="primary"
          data-component="CheckoutSubmitButton"
          data-panda-target="Checkout submit"
        >
          Place order
        </button>
        <button
          data-component="InviteModal"
          data-panda-target="Invite share link"
        >
          Copy invite link
        </button>
        <a
          href="./"
          data-component="ConsoleNav"
          data-panda-target="Open standalone console"
        >
          Open console
        </a>
      </div>
    </main>
    <script src="./panda-notes-widget.js"></script>
    <script>
      PandaNotes.init({
        project: "Panda Notes Demo",
        role: "beta",
        mode: "local",
        contextMenu: true
      });
    </script>
  </body>
</html>
